[project]
name = "docintel"
version = "0.1.0"
description = "Document intelligence platform: RAG with citations, structured extraction, agents, evaluation and tracing."
authors = [
    { name = "kuzetshy", email = "abyla015@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "google-genai>=2.34,<3",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16",
    "qdrant-client>=1.20,<1.21",
    "tenacity>=9",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "TID"]

# Rule from CLAUDE.md: provider SDKs are imported only inside the LLM layer.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"google.genai".msg = "Use docintel.llm instead of calling the Gemini SDK directly."
"fastembed".msg = "Use docintel.llm.Embedder instead of importing fastembed."
"anthropic".msg = "Use docintel.llm instead of calling the Anthropic SDK directly."
"openai".msg = "Use docintel.llm instead of calling the OpenAI SDK directly."
"qdrant_client".msg = "Use docintel.retrieval.store.VectorStore instead of qdrant_client."

[tool.ruff.lint.per-file-ignores]
"src/docintel/llm/gemini.py" = ["TID251"]
"src/docintel/llm/embeddings.py" = ["TID251"]
"src/docintel/retrieval/store.py" = ["TID251"]
"tests/llm/test_gemini.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
filterwarnings = [
    # In-memory Qdrant ignores payload indexes; the server uses them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
markers = [
    "live: calls real providers or downloads models; run with `pytest -m live`",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
