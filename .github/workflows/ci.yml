name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-only
        run: docker compose --profile observability config --quiet
      - name: Build API image
        run: docker build -t docintel-api:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8000:8000 docintel-api:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .
